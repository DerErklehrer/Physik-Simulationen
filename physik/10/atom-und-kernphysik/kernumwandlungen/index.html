<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was ändert sich im Atomkern?</title>
<style>
:root{font:clamp(16px,2vw,21px)/1.5 system-ui;color:#203742;background:#f8fafb}
body{max-width:50rem;margin:2rem auto;padding:0 1rem} h1,h2{line-height:1.15} h1{font-size:2.2rem}
button{font:inherit;font-weight:650;border:1px solid #adbac0;border-radius:.4rem;background:white;color:#203742;padding:.5rem 1rem;cursor:pointer}
button[aria-pressed=true],#reveal{background:#9b174a;color:white;border-color:#9b174a}
nav,.buttons{display:flex;gap:.5rem;flex-wrap:wrap} button:focus-visible{outline:3px solid #203742;outline-offset:3px}
article{background:white;border:1px solid #d7dfe2;border-radius:.8rem;padding:1rem 1.4rem;margin:1rem 0;min-height:13rem}
.equation{display:flex;align-items:center;gap:1rem;font-size:2.2rem;margin:.6rem 0;flex-wrap:wrap}
.nuclide{display:inline-grid;grid-template-columns:auto auto;grid-template-rows:1fr 1fr;align-items:center;line-height:1;vertical-align:middle}
.nuclide span{font-size:.55em;text-align:right;padding-right:.18em}.nuclide b{grid-column:2;grid-row:1/3}
[hidden]{display:none!important} .result{color:#216747} .pulse{animation:enter .3s ease-out}@keyframes enter{from{opacity:0;transform:translateY(.3rem)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<h1>Was ändert sich im Atomkern?</h1>
<p>Wähle einen Übergang. Sage zuerst den Endkern voraus. Vergleiche dann mit dem Modell.</p>
<nav aria-label="Übergang wählen"><button type="button" data-i="0">α-Zerfall</button><button type="button" data-i="1">β⁻-Zerfall</button><button type="button" data-i="2">γ-Übergang</button></nav>
<article aria-live="polite">
<h2 id="title"></h2>
<div class="equation" id="equation"></div>
<p id="hint"></p>
<div class="result" id="result" hidden></div>
</article>
<div class="buttons"><button type="button" id="reveal">Ergebnis zeigen</button><button type="button" id="reset">Zur Vorhersage</button></div>
<p>A ist die Massenzahl. Z ist die Protonenzahl. N ist die Neutronenzahl.</p>
<script>
const data = [["α", "Polonium-214", "214", "84", "Po", "Blei-210", "210", "82", "Pb", "Ein Heliumkern mit zwei Protonen und zwei Neutronen wird ausgesendet.", "−4", "−2", "−2"], ["β⁻", "Blei-210", "210", "82", "Pb", "Bismut-210", "210", "83", "Bi", "Ein Neutron wird zu einem Proton. Dabei entstehen ein Elektron und ein Antineutrino, die den Kern verlassen.", "0", "+1", "−1"], ["γ", "Barium-137m", "137", "56", "Baᵐ", "Barium-137", "137", "56", "Ba", "Der angeregte Kern geht in einen energieärmeren Zustand über und sendet ein γ-Photon aus.", "0", "0", "0"]];
let index = 0;
let revealed = false;
const get = id => document.getElementById(id);
const buttons = [...document.querySelectorAll('[data-i]')];
const hints = ['Der Kern gibt zwei Protonen und zwei Neutronen ab.', 'Im Kern wird ein Neutron zu einem Proton.', 'Das m kennzeichnet hier den metastabilen, angeregten Zustand.'];
function symbol(a,z,x) {
  return '<span class="nuclide" aria-label="'+x+', Massenzahl '+a+', Protonenzahl '+z+'"><span>'+a+'</span><span>'+z+'</span><b>'+x+'</b></span>';
}
function draw() {
  const [mode,start,a,z,x,end,b,w,y,description,da,dz,dn] = data[index];
  buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  get('title').textContent = start;
  get('equation').innerHTML = symbol(a,z,x)+'<span aria-label="Übergang '+mode+'">→</span>' + (revealed ? symbol(b,w,y) : '<span>?</span>');
  get('hint').textContent = hints[index];
  get('result').hidden = !revealed;
  get('result').classList.toggle('pulse',revealed);
  get('result').textContent = end + '. ' + description + ' Änderung: A ' + da + ', Z ' + dz + ', N ' + dn + '.';
  get('reveal').setAttribute('aria-expanded',String(revealed));
}
buttons.forEach((button,i)=>button.addEventListener('click',()=>{index=i;revealed=false;draw()}));
get('reveal').addEventListener('click',()=>{revealed=true;draw()});
get('reset').addEventListener('click',()=>{revealed=false;draw()});
draw();
</script></html>
