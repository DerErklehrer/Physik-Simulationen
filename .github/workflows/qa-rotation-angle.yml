name: Mathematik – Startwinkel und Viertelschnitt
on:
  push:
    paths:
      - 'assets/rotation-angle.js'
      - 'tests/rotation-angle-browser.mjs'
      - '.github/workflows/qa-rotation-angle.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rotation-angle-server.log 2>&1 &
          node tests/rotation-angle-browser.mjs
