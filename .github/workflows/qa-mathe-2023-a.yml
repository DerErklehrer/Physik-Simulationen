name: Mathematik I 2023 – A-Aufgaben
on:
  push:
    paths:
      - 'abschlusspruefung/2023/haupttermin/**'
      - 'abschlusspruefung/tests/*2023_a.mjs'
      - '.github/workflows/qa-mathe-2023-a.yml'
  workflow_dispatch:
jobs:
  qualitaet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fachliche und strukturelle Prüfungen
        run: |
          for pass in 1 2 3; do
            node abschlusspruefung/tests/quality_2023_a.mjs
          done
          node abschlusspruefung/tests/quality_2024_a.mjs
          node abschlusspruefung/tests/quality_2025.mjs
          node abschlusspruefung/tests/source_2025.mjs
      - name: Browser bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP-Server
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/2023-a-server.log 2>&1 &
          sleep 2
      - name: Drei Browserdurchläufe auf Desktop und Mobil
        env:
          QA_OUT: /tmp/2023-a-qa
        run: node abschlusspruefung/tests/browser_2023_a.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematik-2023-a-browserkontrolle
          path: /tmp/2023-a-qa/
