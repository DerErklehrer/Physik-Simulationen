name: Trigonometrie – eigenständige Abschlussprüfungsübungen
on:
  push:
    paths:
      - 'mathematik-10/**'
      - 'tests/trig-exam-pool*.mjs'
      - '.github/workflows/qa-trig-exam-pool.yml'
  workflow_dispatch:
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/trig-exam-pool.mjs
      - name: Browser bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Webserver
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/trig-pool-server.log 2>&1 &
          sleep 2
      - name: Alle Einzelübungen und räumlichen Ansichten auf Desktop und Mobil
        run: node tests/trig-exam-pool-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trigonometrie-abschlusspruefungsaufgaben-browserbelege
          path: /tmp/trig-pool-qa/

