name: Alte AP – Rotationskörper 2016
on:
  push:
    paths:
      - 'mathematik-realschule/alte-ap-aufgaben/rotationskoerper/**'
      - 'tests/old-rotation-2016.mjs'
      - '.github/workflows/qa-old-rotation-2016.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Drei vollständige Prüfdurchgänge
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/old-ap-server.log 2>&1 &
          node tests/old-rotation-2016.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alte-ap-2016-pruefung
          path: /tmp/old-rotation-2016/

