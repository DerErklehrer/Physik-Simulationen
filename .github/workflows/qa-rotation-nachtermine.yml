name: Mathematik – Rotationskörper Nachtermine
on:
  push:
    paths:
      - 'abschlusspruefung/2024/nachtermin/**'
      - 'abschlusspruefung/2025/nachtermin/**'
      - 'abschlusspruefung/shared/rotation-nt/**'
      - 'mathematik-realschule/10-ii-iii/abschlusspruefungen/2026/nachtermin/**'
      - 'abschlusspruefung/tests/*rotation_nt.mjs'
      - '.github/workflows/qa-rotation-nachtermine.yml'
  workflow_dispatch:
jobs:
  qualitaet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node abschlusspruefung/tests/quality_rotation_nt.mjs
          node abschlusspruefung/tests/quality_rotation_ii.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rotation-nt-server.log 2>&1 &
      - run: node abschlusspruefung/tests/browser_rotation_nt.mjs
        env:
          QA_TASK: '2026-II'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rotationskoerper-Nachtermine-Pruefbelege
          path: /tmp/rotation-nt-qa/
