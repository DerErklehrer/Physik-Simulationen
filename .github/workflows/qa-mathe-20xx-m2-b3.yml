name: Mathematik I 20XX – Muster 2 B3
on:
  push:
    paths:
      - 'abschlusspruefung/20xx/muster2/b3.html'
      - 'abschlusspruefung/tests/*20xx_m2_b3.mjs'
      - '.github/workflows/qa-mathe-20xx-m2-b3.yml'
  workflow_dispatch:
jobs:
  qualitaet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fachliche Prüfungen
        run: |
          node abschlusspruefung/tests/quality_20xx_m2_b3.mjs
          node abschlusspruefung/tests/quality_20xx_m2_a.mjs
          node abschlusspruefung/tests/quality_20xx_m1_b34.mjs
      - name: Browser bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP-Server
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/20xx-m2-b3-server.log 2>&1 &
          sleep 2
      - name: Drei Browserdurchläufe auf Desktop und Mobil
        env:
          QA_OUT: /tmp/20xx-m2-b3-qa
        run: node abschlusspruefung/tests/browser_20xx_m2_b3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematik-20xx-muster2-b3-browserkontrolle
          path: /tmp/20xx-m2-b3-qa/
