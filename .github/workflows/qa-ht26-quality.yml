name: Mathematik I 2026 – Schrittfolge und Ansichten
on:
  push:
    paths:
      - 'abschlusspruefung/2026/haupttermin/**'
      - 'mathematik-10/abschlusspruefungsaufgaben/2026/**'
      - 'abschlusspruefung/tests/ht26-browser.mjs'
      - '.github/workflows/qa-ht26-quality.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ht26-server.log 2>&1 &
          node abschlusspruefung/tests/ht26-browser.mjs
